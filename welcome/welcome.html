<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Welcome | Memora</title>


<link rel="stylesheet" href="welcome.css">


</head>


<body class="welcome-page">





<div class="welcome-container">






<!-- LOGO -->

<div class="welcome-logo">


    <div class="big-orbit orbit-one">

        <span class="big-planet"></span>

    </div>


    <div class="big-orbit orbit-two">

        <span class="big-planet"></span>

    </div>


    <div class="big-orbit orbit-three">

        <span class="big-planet"></span>

    </div>




    <div class="big-logo-m">

        M

    </div>



</div>









<!-- TITLE -->


<h1>

Welcome to Memora

</h1>



<p class="subtitle">

Your personal memory space

</p>









<!-- LOGIN -->


<section class="auth-card">



<h2>

Войти

</h2>




<input

id="loginLogin"

type="text"

placeholder="Логин"

>





<input

id="loginPassword"

type="password"

placeholder="Пароль"

>






<button

id="loginBtn"

class="main-button">

Войти

</button>




</section>









<!-- REGISTER -->


<section class="auth-card">



<h2>

Создать аккаунт

</h2>




<input

id="registerLogin"

type="text"

placeholder="Придумайте логин"

>





<input

id="registerPassword"

type="password"

placeholder="Придумайте пароль"

>






<button

id="registerBtn"

class="secondary-button">

Создать аккаунт

</button>




</section>







</div>







<script src="auth.js"></script>



</body>

</html>
