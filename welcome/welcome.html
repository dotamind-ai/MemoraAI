<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memora Welcome</title>

<link rel="stylesheet" href="welcome.css">

</head>


<body class="welcome-page">


<!-- ФОНОВЫЕ ЧАСТИЦЫ -->

<div class="particles">

    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>
    <span class="particle"></span>

</div>



<div class="welcome-container">


    <!-- =========================================
                    LOGO
    ========================================== -->

    <div class="welcome-logo">


        <div class="big-orbit orbit-one">

            <span class="big-planet"></span>

        </div>


        <div class="big-orbit orbit-two">

            <span class="big-planet"></span>

        </div>


        <div class="big-orbit orbit-three">

            <span class="big-planet"></span>

        </div>


        <div class="big-logo-m">

            M

        </div>


    </div>



    <!-- =========================================
                    TEXT
    ========================================== -->

    <h1>

        Welcome to Memora

    </h1>


    <p class="subtitle">

        Your personal memory space

    </p>



    <!-- =========================================
                    AUTH
    ========================================== -->

    <div class="auth-card" id="authCard">


        <h2 id="authTitle">

            Welcome back

        </h2>


        <input

            id="loginInput"

            type="email"

            placeholder="Email"

            autocomplete="email"

        >


        <input

            id="passwordInput"

            type="password"

            placeholder="Password"

            autocomplete="current-password"

        >


        <button

            id="authButton"

            class="main-button"

            type="button"

        >

            Login

        </button>


        <button

            id="switchButton"

            class="secondary-button"

            type="button"

        >

            Create account

        </button>


        <p id="authMessage"></p>


    </div>


</div>



<!-- =========================================
            SUPABASE JS LIBRARY
========================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- =========================================
                    AUTH JS
========================================== -->

<script src="auth.js"></script>


</body>

</html>
