<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Welcome to Memora</title>


<link rel="stylesheet" href="welcome.css">


</head>



<body class="welcome-page">





<div class="welcome-container">






<!-- LOGO -->

<div class="welcome-logo">



    <div class="big-orbit orbit-one">

        <span class="big-planet"></span>

    </div>




    <div class="big-orbit orbit-two">

        <span class="big-planet"></span>

    </div>





    <div class="big-orbit orbit-three">

        <span class="big-planet"></span>

    </div>





    <div class="big-logo-m">

        M

    </div>




</div>









<!-- TEXT -->


<h1>

Memora

</h1>



<p class="subtitle">

Your memory space

</p>








<!-- LOGIN -->


<div class="auth-card">



<h2>

Welcome back

</h2>




<input

id="loginInput"

type="text"

placeholder="Login"

>




<input

id="passwordInput"

type="password"

placeholder="Password"

>







<button

class="main-button"

onclick="login()"

>

Enter

</button>




</div>










<!-- REGISTER -->


<div class="auth-card">



<h2>

Create account

</h2>




<input

id="newLogin"

type="text"

placeholder="New login"

>




<input

id="newPassword"

type="password"

placeholder="New password"

>






<button

class="secondary-button"

onclick="register()"

>

Create

</button>




</div>









</div>







<script src="auth.js"></script>



</body>


</html>
