<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Memora</title>

    <link
        rel="stylesheet"
        href="welcome.css"
    >

</head>


<body class="welcome-page">


    <!-- =========================================
                    BACKGROUND PARTICLES
    ========================================== -->

    <div class="particles">

        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>
        <span class="particle"></span>

    </div>



    <!-- =========================================
                    MAIN CONTAINER
    ========================================== -->

    <div class="welcome-container">


        <!-- =====================================
                    LOGO
        ====================================== -->

        <div class="welcome-logo">


            <div class="big-orbit orbit-one">

                <span class="big-planet"></span>

            </div>


            <div class="big-orbit orbit-two">

                <span class="big-planet"></span>

            </div>


            <div class="big-orbit orbit-three">

                <span class="big-planet"></span>

            </div>


            <div class="big-logo-m">

                M

            </div>


        </div>



        <!-- =====================================
                    TEXT
        ====================================== -->

        <h1>

            Welcome to Memora

        </h1>


        <p class="subtitle">

            Your personal memory space

        </p>



        <!-- =====================================
                    AUTH CARD
        ====================================== -->

        <div
            class="auth-card"
            id="authCard"
        >


            <h2 id="authTitle">

                Welcome back

            </h2>



            <!-- EMAIL -->

            <input
                id="loginInput"
                type="email"
                placeholder="Email address"
                autocomplete="email"
            >



            <!-- PASSWORD -->

            <input
                id="passwordInput"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
            >



            <!-- MAIN BUTTON -->

            <button
                id="authButton"
                class="main-button"
                type="button"
            >

                Login

            </button>



            <!-- SWITCH BUTTON -->

            <button
                id="switchButton"
                class="secondary-button"
                type="button"
            >

                Create account

            </button>



            <!-- MESSAGE -->

            <p id="authMessage"></p>


        </div>


    </div>



    <!-- =========================================
                    SUPABASE
    ========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>



    <!-- =========================================
                    AUTH
    ========================================== -->

    <script src="auth.js"></script>


</body>

</html>
