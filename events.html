<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Memora Events</title>


<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="events.css">


</head>


<body class="events-page">


<main class="events-container">


<div class="events-header">

    <h1>
        Events
    </h1>

    <div class="header-line"></div>

    <p class="events-subtitle">
        Your important moments
    </p>

</div>





<button 
class="new-event"
id="newEvent">

+ New Event

</button>








<section 
class="event-form hidden"
id="eventForm">


<input
id="eventTitle"
placeholder="Event title">



<textarea
id="eventText"
placeholder="Description">
</textarea>





<select id="eventType">


<option value="idea">
Idea
</option>


<option value="goal">
Goal
</option>


<option value="note">
Note
</option>


<option value="project">
Project
</option>


<option value="personal">
Personal
</option>


</select>





<input
id="eventDate"
type="date">





<div class="form-buttons">


<button id="saveEvent">
Save
</button>


<button id="cancelEvent">
Cancel
</button>


</div>



</section>








<section 
id="eventList"
class="event-list">


</section>





</main>









<nav class="bottom-nav">



<button 
class="nav-item"
onclick="goHome()">


<img
src="icons/memories.svg"
class="nav-icon">


<small>
Memories
</small>


</button>





<button 
class="nav-item"
onclick="goCalendar()">


<img
src="icons/calendar.svg"
class="nav-icon">


<small>
Calendar
</small>


</button>





<button 
class="nav-item active"
onclick="goEvents()">



<img
src="icons/events.svg"
class="nav-icon">


<small>
Events
</small>


</button>





<button 
class="nav-item"
onclick="goProfile()">



<img
src="icons/profile.svg"
class="nav-icon">


<small>
Profile
</small>


</button>





</nav>








<script src="events.js"></script>


</body>

</html>
