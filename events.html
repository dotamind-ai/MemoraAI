<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Memora Events</title>


<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="events.css">


</head>


<body class="events-page">


<main class="events-container">


<h1>
Events
</h1>


<p class="subtitle">
Your important moments
</p>



<button 
class="create-event"
id="newEvent">

+ New Event

</button>





<div 
class="event-form hidden"
id="eventForm">


<input
id="eventTitle"
type="text"
placeholder="Event title">



<textarea
id="eventText"
placeholder="Description">
</textarea>




<select id="eventType">

<option value="idea">
Idea
</option>

<option value="goal">
Goal
</option>

<option value="project">
Project
</option>

<option value="personal">
Personal
</option>


</select>





<input
id="eventDate"
type="date">





<div class="form-buttons">


<button id="saveEvent">

Save

</button>



<button id="cancelEvent">

Cancel

</button>


</div>



</div>





<section 
id="eventList"
class="event-list">

</section>



</main>







<nav class="bottom-nav">


<button 
class="nav-item"
onclick="goHome()">

<img src="icons/memories.svg">

<small>
Memories
</small>

</button>




<button 
class="nav-item"
onclick="goCalendar()">

<img src="icons/calendar.svg">

<small>
Calendar
</small>

</button>




<button 
class="nav-item active"
onclick="goEvents()">

<img src="icons/events.svg">

<small>
Events
</small>

</button>




<button 
class="nav-item"
onclick="goProfile()">

<img src="icons/profile.svg">

<small>
Profile
</small>

</button>



</nav>






<script src="events.js"></script>


</body>

</html>
