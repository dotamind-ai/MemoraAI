<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Memora — Timeline</title>

    <link
        rel="stylesheet"
        href="events.css"
    >

</head>


<body class="timeline-page">


    <!-- =========================================
            BACKGROUND
    ========================================== -->

    <div class="timeline-background">

        <div class="timeline-glow glow-one"></div>

        <div class="timeline-glow glow-two"></div>

        <div class="timeline-grid"></div>

    </div>



    <!-- =========================================
            MAIN
    ========================================== -->

    <main class="timeline-container">


        <!-- HEADER -->

        <header class="timeline-header">


            <button
                id="backButton"
                class="icon-button"
                type="button"
                aria-label="Back"
            >

                ←

            </button>


            <div class="timeline-title">

                <span>TIMELINE</span>

                <small>YOUR MEMORY HISTORY</small>

            </div>


        </header>



        <!-- =====================================
                INTRO
        ====================================== -->

        <section class="timeline-intro">


            <div>

                <span class="section-kicker">
                    MEMORY SPACE
                </span>

                <h1>
                    Your memories
                </h1>

                <p>
                    Everything you've saved, in one place.
                </p>

            </div>


            <div
                id="timelineCount"
                class="timeline-count"
            >
                0
            </div>


        </section>



        <!-- =====================================
                SEARCH
        ====================================== -->

        <section class="timeline-tools">


            <div class="search-box">


                <span class="search-icon">
                    ⌕
                </span>


                <input
                    id="searchInput"
                    type="search"
                    placeholder="Search memories..."
                    autocomplete="off"
                >


            </div>



            <div class="filter-row">


                <button
                    class="filter-button active"
                    data-filter="all"
                    type="button"
                >
                    All
                </button>


                <button
                    class="filter-button"
                    data-filter="idea"
                    type="button"
                >
                    Idea
                </button>


                <button
                    class="filter-button"
                    data-filter="note"
                    type="button"
                >
                    Note
                </button>


                <button
                    class="filter-button"
                    data-filter="inspiration"
                    type="button"
                >
                    Inspiration
                </button>


                <button
                    class="filter-button"
                    data-filter="goal"
                    type="button"
                >
                    Goal
                </button>


            </div>


        </section>



        <!-- =====================================
                TIMELINE
        ====================================== -->

        <section
            id="timelineList"
            class="timeline-list"
        >

            <div class="timeline-loading">

                <div class="loading-ring"></div>

                <span>
                    Loading memories...
                </span>

            </div>

        </section>


    </main>



    <!-- =========================================
            EDIT MODAL
    ========================================== -->

    <div
        id="editModal"
        class="modal-overlay"
    >


        <div class="edit-modal">


            <div class="modal-header">


                <div>

                    <span class="section-kicker">
                        EDIT MEMORY
                    </span>

                    <h2>
                        Update your memory
                    </h2>

                </div>


                <button
                    id="closeModal"
                    class="modal-close"
                    type="button"
                    aria-label="Close"
                >
                    ×
                </button>


            </div>



            <label for="editTitle">
                Title
            </label>


            <input
                id="editTitle"
                type="text"
                placeholder="Memory title..."
                maxlength="120"
            >



            <label for="editType">
                Type
            </label>


            <select id="editType">


                <option value="idea">
                    Idea
                </option>


                <option value="note">
                    Note
                </option>


                <option value="inspiration">
                    Inspiration
                </option>


                <option value="goal">
                    Goal
                </option>


            </select>



            <label for="editContent">
                Content
            </label>


            <textarea
                id="editContent"
                placeholder="Memory content..."
            ></textarea>



            <div
                id="editMessage"
                class="edit-message"
            ></div>



            <div class="modal-actions">


                <button
                    id="deleteButton"
                    class="delete-button"
                    type="button"
                >
                    Delete
                </button>


                <button
                    id="saveEditButton"
                    class="save-edit-button"
                    type="button"
                >
                    Save changes
                </button>


            </div>


        </div>


    </div>



    <!-- =========================================
            BOTTOM NAV
    ========================================== -->

    <nav class="bottom-nav">


        <button
            class="nav-item"
            id="homeNav"
            type="button"
        >

            <span class="nav-icon">
                ◉
            </span>

            <small>
                Memories
            </small>

        </button>



        <button
            class="nav-item"
            id="calendarNav"
            type="button"
        >

            <span class="nav-icon">
                ◫
            </span>

            <small>
                Calendar
            </small>

        </button>



        <button
            class="nav-item active"
            id="timelineNav"
            type="button"
        >

            <span class="nav-icon">
                ◇
            </span>

            <small>
                Timeline
            </small>

        </button>



        <button
            class="nav-item"
            id="profileNav"
            type="button"
        >

            <span class="nav-icon">
                ●
            </span>

            <small>
                Profile
            </small>

        </button>


    </nav>



    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <script src="events.js"></script>


</body>

</html>
