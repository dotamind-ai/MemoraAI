<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Memora Events</title>



<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="events.css">



</head>



<body class="events-page">





<div class="events-container">



<h1 class="page-title">

Events

</h1>





<p class="page-subtitle">

Your important moments

</p>









<!-- Кнопка создания -->

<button 
class="new-event-button"
id="newEvent">


+ New Event


</button>









<!-- Форма -->

<div 
class="event-form hidden"
id="eventForm">



<input 
type="text"
id="eventTitle"
placeholder="Event title">






<textarea
id="eventText"
placeholder="Description">
</textarea>







<select id="eventType">


<option value="idea">

Idea

</option>


<option value="goal">

Goal

</option>


<option value="project">

Project

</option>


<option value="personal">

Personal

</option>


</select>







<input 
type="date"
id="eventDate">







<div class="form-buttons">



<button 
id="saveEvent">

Save

</button>





<button 
id="cancelEvent">

Cancel

</button>



</div>



</div>









<!-- Список событий -->

<div 
id="eventList"
class="event-list">


</div>






</div>









<!-- Нижняя навигация -->

<nav class="bottom-nav">



<button 
class="nav-item"
onclick="goHome()">



<img
src="icons/memories.svg"
class="nav-icon">



<small>

Memories

</small>


</button>







<button 
class="nav-item"
onclick="goCalendar()">



<img
src="icons/calendar.svg"
class="nav-icon">



<small>

Calendar

</small>


</button>







<button 
class="nav-item active"
onclick="goEvents()">



<img
src="icons/events.svg"
class="nav-icon">



<small>

Events

</small>


</button>







<button 
class="nav-item"
onclick="goProfile()">



<img
src="icons/profile.svg"
class="nav-icon">



<small>

Profile

</small>


</button>





</nav>









<script src="events.js"></script>



</body>

</html>
