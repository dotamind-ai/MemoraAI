<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEMORA Calendar</title>

<link rel="stylesheet" href="style.css">

</head>


<body class="calendar-page">


<div class="app">


<header>

<div class="logo">

<div class="core">

<div class="ring"></div>

<div class="memory-letter">
M
</div>

</div>

</div>


<h1>
Календарь
</h1>


<p>
Твои воспоминания
</p>


</header>





<section class="glass calendar-box">


<div class="calendar-header">


<button onclick="changeMonth(-1)">
‹
</button>


<h2 id="monthTitle">
Июль 2026
</h2>


<button onclick="changeMonth(1)">
›
</button>


</div>



<div 
id="calendarGrid"
class="calendar-grid">

</div>



</section>



</div>







<div 
id="memoryModal"
class="memory-modal">


<div class="memory-window">


<button 
class="close-memory"
onclick="closeMemory()">

×

</button>


<h2 id="memoryDate">
Дата
</h2>


<textarea 
id="memoryText"
placeholder="Что произошло сегодня?">
</textarea>



<button 
class="save-memory"
onclick="saveMemory()">

Сохранить

</button>


</div>


</div>







<nav class="bottom-nav">


<button onclick="goHome()">
🏠
</button>


<button class="active">
📅
</button>


<button onclick="goFavorites()">
⭐
</button>


<button onclick="goSettings()">
⚙️
</button>


</nav>






<script src="app.js"></script>


<script src="./calendar.js"></script>



<script>

alert("calendar.html обновился");

</script>



</body>

</html>
