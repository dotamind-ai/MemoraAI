<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEMORA Calendar</title>

<link rel="stylesheet" href="style.css">

</head>


<body class="calendar-page">


<div class="app">


<header>


<div class="logo">

<div class="core">

<div class="ring"></div>

<div class="memory-letter">
M
</div>

</div>

</div>


<h1>
Календарь
</h1>


<p>
История твоих воспоминаний
</p>


</header>





<section class="glass calendar-box">



<div class="calendar-header">



<button onclick="changeMonth(-1)">
‹
</button>



<h2 id="monthTitle">
Июль 2026
</h2>



<button onclick="changeMonth(1)">
›
</button>



</div>





<div class="calendar-grid" id="calendarGrid">

</div>




<p class="calendar-empty">

Твои воспоминания появятся здесь

</p>



</section>




</div>






<!-- Окно воспоминания -->


<div class="memory-modal" id="memoryModal">


<div class="memory-window">


<button 
class="close-memory" 
onclick="closeMemory()">

×

</button>



<h2 id="memoryDate">

24 июля

</h2>



<p>
Новое воспоминание
</p>




<textarea 
id="memoryText"
placeholder="Что произошло сегодня?"
></textarea>




<button 
class="save-memory" 
onclick="saveMemory()">

Сохранить

</button>



</div>


</div>








<!-- Нижняя навигация -->


<nav class="bottom-nav">



<button 
class="nav-item" 
onclick="goHome()">

<span>
🏠
</span>

</button>




<button 
class="nav-item active">

<span>
📅
</span>

</button>




<button 
class="nav-item" 
onclick="goFavorites()">

<span>
⭐
</span>

</button>




<button 
class="nav-item" 
onclick="goSettings()">

<span>
⚙️
</span>

</button>



</nav>







<script src="app.js"></script>

<script src="calendar.js"></script>



</body>

</html>
