<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEMORA — Календарь</title>

<link rel="stylesheet" href="calendar.css">

</head>


<body class="calendar-page">


<!-- ЛОГОТИП MEMORA -->

<div class="memora-logo">

    <div class="orbit orbit-one">
        <div class="planet planet-one"></div>
    </div>

    <div class="orbit orbit-two">
        <div class="planet planet-two"></div>
    </div>

    <div class="orbit orbit-three">
        <div class="planet planet-three"></div>
    </div>


    <div class="logo-sphere">

        <span>M</span>

    </div>

</div>





<div class="calendar-container">


<h1>Календарь</h1>



<div class="calendar-header">


<button id="prevMonth" class="month-btn">
‹
</button>



<h2 id="monthTitle"></h2>



<button id="nextMonth" class="month-btn">
›
</button>


</div>





<div class="week-days">

<div>Пн</div>
<div>Вт</div>
<div>Ср</div>
<div>Чт</div>
<div>Пт</div>
<div>Сб</div>
<div>Вс</div>

</div>





<div id="calendarGrid" class="calendar-grid"></div>



</div>





<script src="calendar.js"></script>


</body>

</html>
