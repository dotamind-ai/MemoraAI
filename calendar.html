<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Memora — Calendar</title>

<link
    rel="stylesheet"
    href="calendar.css"
>

</head>


<body class="calendar-page">


<div class="calendar-background">

    <div class="calendar-glow glow-one"></div>

    <div class="calendar-glow glow-two"></div>

    <div class="calendar-grid"></div>

</div>



<main class="calendar-container">


<header class="calendar-header">


    <button
        id="backButton"
        class="icon-button"
        type="button"
    >
        ←
    </button>


    <div class="calendar-title">

        <span>CALENDAR</span>

        <small>YOUR MEMORY DATES</small>

    </div>


    <button
        id="todayButton"
        class="today-button"
        type="button"
    >
        Today
    </button>


</header>



<section class="month-controls">


    <button
        id="previousMonth"
        class="month-arrow"
        type="button"
    >
        ‹
    </button>


    <div class="month-title">

        <h1 id="monthName">
            Loading...
        </h1>

        <span id="memoryMonthCount">
            0 memories
        </span>

    </div>


    <button
        id="nextMonth"
        class="month-arrow"
        type="button"
    >
        ›
    </button>


</section>



<section class="calendar-card">


    <div class="weekdays">

        <span>MON</span>
        <span>TUE</span>
        <span>WED</span>
        <span>THU</span>
        <span>FRI</span>
        <span>SAT</span>
        <span>SUN</span>

    </div>


    <div
        id="calendarGrid"
        class="calendar-grid-days"
    ></div>


</section>



<section
    id="dayPanel"
    class="day-panel"
>


    <div class="day-panel-header">


        <div>

            <span class="section-kicker">
                SELECTED DAY
            </span>

            <h2 id="selectedDate">
                Choose a day
            </h2>

        </div>


        <span
            id="selectedCount"
            class="selected-count"
        >
            0
        </span>


    </div>


    <div
        id="dayMemories"
        class="day-memories"
    >


        <div class="day-empty">

            <div class="empty-icon">
                ◇
            </div>

            <div class="empty-title">
                Choose a date
            </div>

            <div class="empty-text">
                Select a day in the calendar to see your memories.
            </div>

        </div>


    </div>


</section>


</main>



<nav class="bottom-nav">


    <button
        class="nav-item"
        id="homeNav"
        type="button"
    >

        <span class="nav-icon">
            ◉
        </span>

        <small>
            Memories
        </small>

    </button>



    <button
        class="nav-item active"
        id="calendarNav"
        type="button"
    >

        <span class="nav-icon">
            ◫
        </span>

        <small>
            Calendar
        </small>

    </button>



    <button
        class="nav-item"
        id="timelineNav"
        type="button"
    >

        <span class="nav-icon">
            ◇
        </span>

        <small>
            Timeline
        </small>

    </button>



    <button
        class="nav-item"
        id="chatNav"
        type="button"
    >

        <span class="nav-icon">
            ▱
        </span>

        <small>
            Chats
        </small>

    </button>


</nav>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="calendar.js"></script>


</body>

</html>
