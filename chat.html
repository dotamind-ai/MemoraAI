<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Memora — Chats</title>

    <link
        rel="stylesheet"
        href="chat.css"
    >

</head>


<body class="chat-page">


    <!-- =========================================
         BACKGROUND
    ========================================== -->

    <div class="chat-background">

        <div class="background-glow glow-one"></div>

        <div class="background-glow glow-two"></div>

    </div>



    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="chat-container">


        <!-- =====================================
             HEADER
        ====================================== -->

        <header class="chat-header">


            <div class="brand">


                <div class="brand-mark">

                    <span>M</span>

                </div>


                <div class="brand-copy">

                    <strong>
                        MEMORA
                    </strong>

                    <span>
                        CHATS
                    </span>

                </div>


            </div>



            <div class="header-actions">


                <!-- ADD FRIEND -->

                <button
                    id="addFriendButton"
                    class="header-button"
                    type="button"
                    aria-label="Add friend"
                >

                    <svg
                        class="header-svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >

                        <path d="M12 5V19"></path>

                        <path d="M5 12H19"></path>

                    </svg>

                </button>



                <!-- NOTIFICATIONS -->

                <button
                    id="notificationButton"
                    class="header-button notification-button"
                    type="button"
                    aria-label="Notifications"
                >

                    <svg
                        class="bell-svg"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >

                        <path
                            d="M18 9.5C18 6.46 16.21 4 12 4C7.79 4 6 6.46 6 9.5C6 14.5 4 16 4 17H20C20 16 18 14.5 18 9.5Z"
                        ></path>

                        <path
                            d="M9.5 20C10.15 20.63 11.02 21 12 21C12.98 21 13.85 20.63 14.5 20"
                        ></path>

                    </svg>


                    <span
                        id="notificationBadge"
                        class="notification-badge"
                        hidden
                    >
                        0
                    </span>

                </button>



                <!-- PROFILE -->

                <button
                    id="profileButton"
                    class="profile-button"
                    type="button"
                    aria-label="Profile"
                >

                    <div
                        id="myAvatar"
                        class="my-avatar"
                    >
                        M
                    </div>

                </button>


            </div>


        </header>



        <!-- =====================================
             NOTIFICATIONS
        ====================================== -->

        <div
            id="notificationPanel"
            class="notification-panel"
            hidden
        >


            <div class="panel-header">


                <div>

                    <span class="panel-kicker">
                        ACTIVITY
                    </span>

                    <h2>
                        Notifications
                    </h2>

                </div>


                <div class="notification-panel-actions">


                    <button
                        id="clearNotificationsButton"
                        class="clear-notifications"
                        type="button"
                    >
                        Clear
                    </button>


                    <button
                        id="closeNotificationPanel"
                        class="panel-close"
                        type="button"
                        aria-label="Close"
                    >
                        ×
                    </button>


                </div>


            </div>


            <div
                id="notificationList"
                class="notification-list"
            ></div>


        </div>



        <!-- =====================================
             ADD FRIEND
        ====================================== -->

        <div
            id="addFriendPanel"
            class="add-friend-panel"
            hidden
        >


            <div class="panel-header">


                <div>

                    <span class="panel-kicker">
                        CONNECTION
                    </span>

                    <h2>
                        Add friend
                    </h2>

                </div>


                <button
                    id="closeAddFriendPanel"
                    class="panel-close"
                    type="button"
                    aria-label="Close"
                >
                    ×
                </button>


            </div>


            <div class="add-friend-row">


                <input
                    id="emailSearch"
                    type="email"
                    placeholder="Email address..."
                    autocomplete="off"
                >


                <button
                    id="searchButton"
                    type="button"
                >
                    Find
                </button>


            </div>


            <div
                id="searchMessage"
                class="search-message"
            ></div>


            <div
                id="searchResult"
                class="search-result"
            ></div>


        </div>



        <!-- =====================================
             CHATS
        ====================================== -->

        <section
            id="friendsView"
            class="friends-view"
        >


            <div class="page-heading">


                <div>

                    <span class="heading-kicker">
                        MESSENGER
                    </span>

                    <h1>
                        Conversations
                    </h1>

                </div>


                <span
                    id="friendCount"
                    class="heading-count"
                >
                    0
                </span>


            </div>



            <!-- CHAT SEARCH -->

            <div class="chat-search">


                <svg
                    class="search-svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >

                    <circle
                        cx="10.8"
                        cy="10.8"
                        r="6.8"
                    ></circle>

                    <path
                        d="M16 16L21 21"
                    ></path>

                </svg>


                <input
                    id="chatSearchInput"
                    type="search"
                    placeholder="Search chats..."
                    autocomplete="off"
                >


            </div>



            <div
                id="friendList"
                class="friend-list"
            ></div>


        </section>



        <!-- =====================================
             CONVERSATION
        ====================================== -->

        <section
            id="conversationView"
            class="conversation-view"
        >


            <header class="conversation-header">


                <button
                    id="conversationBack"
                    class="conversation-back"
                    type="button"
                    aria-label="Back"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >

                        <path
                            d="M15 18L9 12L15 6"
                        ></path>

                    </svg>

                </button>



                <div
                    id="conversationAvatar"
                    class="conversation-avatar"
                >
                    M
                </div>



                <div class="conversation-user">


                    <strong
                        id="conversationName"
                    >
                        Friend
                    </strong>


                    <span
                        id="conversationStatus"
                    >
                        Private conversation
                    </span>


                </div>


            </header>



            <div
                id="messageList"
                class="message-list"
            ></div>



            <form
                id="messageForm"
                class="message-form"
            >


                <textarea
                    id="messageInput"
                    rows="1"
                    maxlength="4000"
                    placeholder="Write a message..."
                ></textarea>


                <button
                    id="sendMessageButton"
                    class="send-button"
                    type="submit"
                    aria-label="Send"
                >

                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >

                        <path
                            d="M5 12H19"
                        ></path>

                        <path
                            d="M13 6L19 12L13 18"
                        ></path>

                    </svg>

                </button>


            </form>


        </section>


    </main>



    <!-- =========================================
         BOTTOM NAVIGATION
    ========================================== -->

    <nav class="bottom-nav">


        <button
            class="nav-item"
            id="homeNav"
            type="button"
        >

            <span class="nav-icon">
                ◉
            </span>

            <small>
                Memories
            </small>

        </button>



        <button
            class="nav-item"
            id="calendarNav"
            type="button"
        >

            <span class="nav-icon">
                ◫
            </span>

            <small>
                Calendar
            </small>

        </button>



        <button
            class="nav-item"
            id="timelineNav"
            type="button"
        >

            <span class="nav-icon">
                ◇
            </span>

            <small>
                Timeline
            </small>

        </button>



        <button
            class="nav-item active"
            id="chatNav"
            type="button"
        >

            <span class="nav-icon">
                ▱
            </span>

            <small>
                Chats
            </small>

        </button>


    </nav>



    <!-- =========================================
         SUPABASE
    ========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =========================================
         CHAT LOGIC
    ========================================== -->

    <script src="chat.js"></script>


</body>

</html>
