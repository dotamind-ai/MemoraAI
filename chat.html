<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Memora — Chats</title>

<link
    rel="stylesheet"
    href="chat.css"
>

</head>


<body class="chat-page">


<div class="chat-background">

    <div class="background-glow glow-one"></div>

    <div class="background-glow glow-two"></div>

</div>



<main class="chat-container">


    <!-- =========================================
            HEADER
    ========================================== -->

    <header class="chat-header">


        <div class="brand">


            <div class="brand-mark">
                M
            </div>


            <div class="brand-copy">

                <strong>
                    MEMORA
                </strong>

                <span>
                    CHATS
                </span>

            </div>


        </div>



        <div class="header-actions">


            <button
                id="addFriendButton"
                class="header-button"
                type="button"
                aria-label="Add friend"
            >

                <span class="plus-icon">
                    +
                </span>

            </button>



            <button
                id="notificationButton"
                class="header-button notification-button"
                type="button"
                aria-label="Notifications"
            >

                <span class="bell-icon">
                    ◇
                </span>


                <span
                    id="notificationBadge"
                    class="notification-badge"
                    hidden
                >
                    0
                </span>

            </button>



            <button
                id="profileButton"
                class="profile-button"
                type="button"
                aria-label="Profile"
            >

                <div
                    id="myAvatar"
                    class="my-avatar"
                >
                    M
                </div>

            </button>


        </div>


    </header>



    <!-- =========================================
            NOTIFICATIONS
    ========================================== -->

    <div
        id="notificationPanel"
        class="notification-panel"
        hidden
    >


        <div class="panel-header">


            <div>

                <span class="panel-kicker">
                    ACTIVITY
                </span>

                <h2>
                    Notifications
                </h2>

            </div>


            <button
                id="closeNotificationPanel"
                class="panel-close"
                type="button"
            >
                ×
            </button>


        </div>


        <div
            id="notificationList"
            class="notification-list"
        ></div>


    </div>



    <!-- =========================================
            ADD FRIEND
    ========================================== -->

    <div
        id="addFriendPanel"
        class="add-friend-panel"
        hidden
    >


        <div class="panel-header">


            <div>

                <span class="panel-kicker">
                    CONNECTION
                </span>

                <h2>
                    Add friend
                </h2>

            </div>


            <button
                id="closeAddFriendPanel"
                class="panel-close"
                type="button"
            >
                ×
            </button>


        </div>


        <div class="add-friend-row">


            <input
                id="emailSearch"
                type="email"
                placeholder="Email address..."
                autocomplete="off"
            >


            <button
                id="searchButton"
                type="button"
            >
                Find
            </button>


        </div>


        <div
            id="searchMessage"
            class="search-message"
        ></div>


        <div
            id="searchResult"
            class="search-result"
        ></div>


    </div>



    <!-- =========================================
            FRIENDS / CHATS
    ========================================== -->

    <section
        id="friendsView"
        class="friends-view"
    >


        <div class="page-heading">


            <div>

                <span class="heading-kicker">
                    MESSENGER
                </span>

                <h1>
                    Conversations
                </h1>

            </div>


            <span
                id="friendCount"
                class="heading-count"
            >
                0
            </span>


        </div>



        <!-- Search chats -->

        <div class="chat-search">


            <span class="search-mark">
                /
            </span>


            <input
                id="chatSearchInput"
                type="search"
                placeholder="Search chats..."
                autocomplete="off"
            >


        </div>



        <div
            id="friendList"
            class="friend-list"
        ></div>


    </section>



    <!-- =========================================
            CONVERSATION
    ========================================== -->

    <section
        id="conversationView"
        class="conversation-view"
    >


        <header class="conversation-header">


            <button
                id="conversationBack"
                class="conversation-back"
                type="button"
                aria-label="Back"
            >
                ←
            </button>



            <div
                id="conversationAvatar"
                class="conversation-avatar"
            >
                M
            </div>



            <div class="conversation-user">


                <strong
                    id="conversationName"
                >
                    Friend
                </strong>


                <span
                    id="conversationStatus"
                >
                    Private conversation
                </span>


            </div>


        </header>



        <div
            id="messageList"
            class="message-list"
        ></div>



        <form
            id="messageForm"
            class="message-form"
        >


            <textarea
                id="messageInput"
                rows="1"
                maxlength="4000"
                placeholder="Write a message..."
            ></textarea>


            <button
                id="sendMessageButton"
                class="send-button"
                type="submit"
                aria-label="Send"
            >
                →
            </button>


        </form>


    </section>



</main>



<!-- =========================================
        BOTTOM NAVIGATION
========================================== -->

<nav class="bottom-nav">


    <button
        class="nav-item"
        id="homeNav"
        type="button"
    >

        <span class="nav-icon">
            ◉
        </span>

        <small>
            Memories
        </small>

    </button>



    <button
        class="nav-item"
        id="calendarNav"
        type="button"
    >

        <span class="nav-icon">
            ◫
        </span>

        <small>
            Calendar
        </small>

    </button>



    <button
        class="nav-item"
        id="timelineNav"
        type="button"
    >

        <span class="nav-icon">
            ◇
        </span>

        <small>
            Timeline
        </small>

    </button>



    <button
        class="nav-item active"
        id="chatNav"
        type="button"
    >

        <span class="nav-icon">
            ▱
        </span>

        <small>
            Chats
        </small>

    </button>


</nav>



<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script src="chat.js"></script>


</body>

</html>
