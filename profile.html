<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Memora Profile</title>



<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="profile.css">



</head>



<body class="profile-page">





<!-- Логотип Memora -->


<div class="memora-profile-logo" id="memoraLogo">


    <div class="logo-orbit orbit-a">
        <span></span>
    </div>


    <div class="logo-orbit orbit-b">
        <span></span>
    </div>


    <div class="logo-orbit orbit-c">
        <span></span>
    </div>



    <div class="logo-letter">

        M

    </div>


</div>









<div class="profile-container">





<!-- Аватар -->


<div class="avatar-wrapper">


    <div 
    class="profile-avatar"
    id="profileAvatar">


        👤


    </div>



    <button 
    class="avatar-camera"
    id="avatarCamera">


        📷


    </button>


</div>









<!-- Имя -->


<h1 
class="profile-name"
id="profileName">


    Гость


</h1>






<p class="profile-status">

    Memory Keeper

</p>









<!-- Статистика -->


<div class="profile-stats">



<div class="stat-card">


<span id="memoryStat">

0

</span>


<small>

Memories

</small>


</div>





<div class="stat-card">


<span id="eventStat">

0

</span>


<small>

Events

</small>


</div>





<div class="stat-card">


<span id="favoriteStat">

0

</span>


<small>

Favorites

</small>


</div>



</div>









<!-- Уровень -->


<div class="profile-level">


<h2>

Memora Level 1

</h2>



<div class="level-bar">


<span></span>


</div>


</div>









<!-- Достижения -->


<div class="achievements">


<h2>

Achievements

</h2>




<div class="achievement-card">

Memory Starter

</div>




<div class="achievement-card">

First Event

</div>




<div class="achievement-card">

Memory Collector

</div>



</div>









<!-- Кнопка меню профиля -->


<div 
class="profile-menu"
id="profileMenu">


<button>

✏️ Edit Profile

</button>


<button onclick="goSettings()">

Settings

</button>


<button id="loginButton">

Login / Register

</button>



</div>





</div>









<!-- Нижняя навигация -->


<nav class="bottom-nav">



<button 
class="nav-item"
onclick="goHome()">



<img 
src="icons/memories.svg"
class="nav-icon">



<small>

Memories

</small>


</button>








<button 
class="nav-item"
onclick="goCalendar()">



<img 
src="icons/calendar.svg"
class="nav-icon">



<small>

Calendar

</small>


</button>








<button 
class="nav-item"
onclick="goEvents()">



<img 
src="icons/events.svg"
class="nav-icon">



<small>

Events

</small>


</button>








<button 
class="nav-item active"
onclick="goProfile()">



<img 
src="icons/profile.svg"
class="nav-icon">



<small>

Profile

</small>


</button>





</nav>








<script src="profile.js"></script>



</body>

</html>
