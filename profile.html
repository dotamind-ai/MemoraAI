<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memora Profile</title>


<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="profile.css">


</head>


<body class="profile-page">



<div class="profile-container">



    <!-- PROFILE CARD -->


    <div class="profile-card">


        <div 
        class="profile-avatar"
        id="profileAvatar">

            👤

        </div>



        <h1 
        class="profile-name"
        id="profileName">

            Гость

        </h1>



        <p class="profile-status">

            ✨ Хранитель воспоминаний

        </p>



    </div>





    <!-- STATISTICS -->


    <div class="profile-stats">


        <div class="stat-card">

            <span id="memoryStat">
                0
            </span>

            <small>
                Память
            </small>

        </div>



        <div class="stat-card">

            <span id="eventStat">
                0
            </span>

            <small>
                События
            </small>

        </div>



        <div class="stat-card">

            <span id="favoriteStat">
                0
            </span>

            <small>
                Избранное
            </small>

        </div>



    </div>







    <!-- MEMORA BUTTON -->


    <button 
    class="memora-menu-button"
    id="openProfileMenu">


        <div class="mini-logo">

            M

        </div>


    </button>








    <!-- ACHIEVEMENTS -->


    <div class="achievements-box">


        <h2>

            🏆 Achievements

        </h2>



        <div class="achievement unlocked">


            <span>

                🧠

            </span>


            <div>

                <h3>
                    Memory Keeper
                </h3>


                <p>
                    Created first memory
                </p>


            </div>


        </div>



        <div class="achievement locked">


            <span>

                🔒

            </span>


            <div>

                <h3>
                    Story Collector
                </h3>


                <p>
                    Create 10 memories
                </p>


            </div>


        </div>



    </div>









</div>









<!-- PROFILE MENU -->


<div 
class="profile-modal hidden"
id="profileModal">


    <div class="profile-modal-card">



        <button 
        class="modal-close"
        id="closeProfileMenu">

            ×

        </button>



        <h2>

            ✨ Memora Menu

        </h2>





        <button class="modal-item">

            👤 Edit Profile

        </button>




        <button 
        class="modal-item"
        onclick="goSettings()">

            ⚙ Settings

        </button>





        <button class="modal-item">

            🔐 Login / Register

        </button>





        <button class="modal-item">

            🎨 Appearance

        </button>





        <button class="modal-item">

            🏆 Achievements

        </button>





        <button class="modal-item">

            ☁ Cloud Sync

        </button>



    </div>


</div>









<!-- NAVIGATION -->


<nav class="bottom-nav">


<button 
class="nav-item"
onclick="goHome()">


🏠

<small>
Главная
</small>


</button>



<button 
class="nav-item"
onclick="goCalendar()">


📅

<small>
Календарь
</small>


</button>



<button 
class="nav-item"
onclick="goEvents()">


✨

<small>
События
</small>


</button>



<button 
class="nav-item active"
onclick="goProfile()">


👤

<small>
Профиль
</small>


</button>


</nav>






<script src="profile.js"></script>


</body>

</html>
