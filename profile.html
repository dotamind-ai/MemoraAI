<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Memora — Profile</title>

<link
    rel="stylesheet"
    href="profile.css"
>

</head>


<body class="profile-page">


<div class="profile-background">

    <div class="glow glow-one"></div>

    <div class="glow glow-two"></div>

</div>



<main class="profile-container">


    <!-- =====================================
            HEADER
    ====================================== -->

    <header class="profile-header">


        <button
            id="backButton"
            class="back-button"
            type="button"
            aria-label="Back"
        >
            ←
        </button>


        <div class="profile-header-title">

            <span>PROFILE</span>

            <small>YOUR MEMORY SPACE</small>

        </div>


    </header>



    <!-- =====================================
            PROFILE HERO
    ====================================== -->

    <section class="profile-hero">


        <div class="profile-orbit">

            <div class="profile-orbit-ring ring-one"></div>

            <div class="profile-orbit-ring ring-two"></div>

            <div class="profile-orbit-ring ring-three"></div>


            <div
                id="avatarPreview"
                class="profile-avatar"
            >

                M

            </div>


        </div>


        <input
            id="avatarInput"
            type="file"
            accept="image/png,image/jpeg,image/webp"
            hidden
        >


        <button
            id="changeAvatarButton"
            class="change-avatar-button"
            type="button"
        >
            Change avatar
        </button>


        <h1 id="profileName">
            Loading...
        </h1>


        <p id="profileEmail">
            Loading...
        </p>


        <div class="account-status">

            <span class="status-dot"></span>

            Account connected

        </div>


    </section>



    <!-- =====================================
            ACCOUNT CARD
    ====================================== -->

    <section class="settings-card">


        <div class="card-heading">


            <div>

                <span class="card-kicker">
                    ACCOUNT
                </span>

                <h2>
                    Personal information
                </h2>

            </div>


            <span class="card-icon">
                ◈
            </span>


        </div>



        <div class="form-group">


            <label for="displayNameInput">
                Display name
            </label>


            <input
                id="displayNameInput"
                type="text"
                maxlength="40"
                placeholder="Your name"
                autocomplete="name"
            >


        </div>



        <div class="email-row">


            <div class="email-info">

                <span class="info-label">
                    Email
                </span>


                <span
                    id="emailValue"
                    class="email-value"
                >
                    Loading...
                </span>

            </div>


            <span class="verified-badge">
                VERIFIED
            </span>


        </div>



        <div
            id="profileMessage"
            class="profile-message"
        ></div>



        <button
            id="saveProfileButton"
            class="save-profile-button"
            type="button"
        >
            Save changes
        </button>


    </section>



    <!-- =====================================
            ACCOUNT STATUS
    ====================================== -->

    <section class="account-card">


        <div class="account-row">


            <div class="account-left">


                <span class="account-label">
                    Authentication
                </span>


                <strong>
                    Supabase
                </strong>


            </div>


            <span class="secure-badge">
                SECURE
            </span>


        </div>



        <div class="account-row">


            <div class="account-left">


                <span class="account-label">
                    Member since
                </span>


                <strong id="accountDate">
                    —
                </strong>


            </div>


        </div>


    </section>



    <!-- =====================================
            LOGOUT
    ====================================== -->

    <section class="actions-card">


        <button
            id="logoutButton"
            class="logout-button"
            type="button"
        >


            <span class="logout-icon">
                ↪
            </span>


            <span class="logout-text">


                <strong>
                    Log out
                </strong>


                <small>
                    Sign out of this device
                </small>


            </span>


            <span class="logout-arrow">
                →
            </span>


        </button>


    </section>


</main>



<!-- =====================================
            BOTTOM NAV
====================================== -->

<nav class="bottom-nav">


    <button
        class="nav-item"
        id="homeNav"
        type="button"
    >

        <span class="nav-icon">
            ◉
        </span>

        <small>
            Memories
        </small>

    </button>



    <button
        class="nav-item"
        id="calendarNav"
        type="button"
    >

        <span class="nav-icon">
            ◫
        </span>

        <small>
            Calendar
        </small>

    </button>



    <button
        class="nav-item"
        id="timelineNav"
        type="button"
    >

        <span class="nav-icon">
            ◇
        </span>

        <small>
            Timeline
        </small>

    </button>



    <button
        class="nav-item active"
        id="profileNav"
        type="button"
    >

        <span class="nav-icon">
            ●
        </span>

        <small>
            Profile
        </small>

    </button>


</nav>



<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script src="profile.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="notifications.js"></script>
</body>

</html>
