<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memora Profile</title>


<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="profile.css">


</head>



<body class="profile-page">



<div class="profile-container">



    <div class="profile-card">



        <!-- Аватар -->

        <div class="profile-avatar" id="profileAvatar">

            👤

        </div>





        <!-- Имя -->

        <h1 
        class="profile-name"
        id="profileName">

            Гость

        </h1>





        <p class="profile-status">

            ✨ Хранитель воспоминаний

        </p>



    </div>








    <!-- Статистика -->


    <div class="profile-stats">



        <div class="stat-card">


            <span id="memoryStat">

                0

            </span>


            <small>

                Память

            </small>


        </div>





        <div class="stat-card">


            <span id="eventStat">

                0

            </span>


            <small>

                События

            </small>


        </div>





        <div class="stat-card">


            <span id="favoriteStat">

                0

            </span>


            <small>

                Избранное

            </small>


        </div>



    </div>








    <!-- Действия -->


    <div class="profile-actions">



        <button 
        class="profile-button"
        id="editProfile">


            ✏️ Изменить профиль


        </button>







        <button 
        class="profile-button"
        onclick="goSettings()">


            ⚙️ Настройки


        </button>







        <button 
        class="profile-button login-button"
        id="loginButton">


            🔐 Войти / Регистрация


        </button>



    </div>






</div>










<!-- Нижняя навигация -->


<nav class="bottom-nav">



<button 
class="nav-item"
onclick="goHome()">


🏠

<small>

Главная

</small>


</button>







<button 
class="nav-item"
onclick="goCalendar()">


📅

<small>

Календарь

</small>


</button>







<button 
class="nav-item"
onclick="goEvents()">


✨

<small>

События

</small>


</button>







<button 
class="nav-item active"
onclick="goProfile()">


👤

<small>

Профиль

</small>


</button>




</nav>








<script src="profile.js"></script>



</body>

</html>
