<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Memora Profile</title>



<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="profile.css">


</head>



<body class="profile-page">





<div class="profile-container">






    <!-- Карточка профиля -->


    <div class="profile-card">



        <div 
        class="profile-avatar" 
        id="profileAvatar">

            👤

        </div>





        <h1 
        class="profile-name"
        id="profileName">

            Гость

        </h1>





        <p class="profile-status">

            ✨ Хранитель воспоминаний

        </p>



    </div>









    <!-- Статистика -->


    <div class="profile-stats">



        <div class="stat-card">


            <span id="memoryStat">

                0

            </span>


            <small>

                Память

            </small>


        </div>







        <div class="stat-card">


            <span id="eventStat">

                0

            </span>


            <small>

                События

            </small>


        </div>







        <div class="stat-card">


            <span id="favoriteStat">

                0

            </span>


            <small>

                Избранное

            </small>


        </div>



    </div>













    <!-- MEMORA CORE BUTTON -->


    <div 
    class="memora-core" 
    id="memoraCore">



        <div class="orbit o1">

            <span></span>

        </div>





        <div class="orbit o2">

            <span></span>

        </div>





        <div class="orbit o3">

            <span></span>

        </div>







        <div class="core-letter">

            M

        </div>



    </div>








    <div 
    class="profile-menu hidden" 
    id="profileMenu">





        <button 
        id="editProfile">

            ✏️ Edit Profile

        </button>






        <button 
        onclick="goSettings()">

            ⚙️ Settings

        </button>






        <button 
        id="loginButton">

            🔐 Login / Register

        </button>






        <button>

            🏆 Achievements

        </button>





    </div>









</div>












<!-- Нижняя навигация -->


<nav class="bottom-nav">





<button 
class="nav-item"
onclick="goHome()">



🏠


<small>

Главная

</small>


</button>









<button 
class="nav-item"
onclick="goCalendar()">



📅


<small>

Календарь

</small>


</button>









<button 
class="nav-item"
onclick="goEvents()">



✨


<small>

События

</small>


</button>









<button 
class="nav-item active"
onclick="goProfile()">



👤


<small>

Профиль

</small>


</button>





</nav>









<script src="profile.js"></script>




</body>

</html>
