<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memora Profile</title>

<link rel="stylesheet" href="style.css">

</head>


<body class="profile-page">


<div class="profile-container">


    <div class="profile-avatar">

        👤

    </div>



    <h1>
        Гость
    </h1>


    <p class="profile-status">
        Хранитель воспоминаний
    </p>




    <div class="profile-stats">


        <div>
            <b id="memoryStat">
                0
            </b>
            <span>
                Память
            </span>
        </div>



        <div>
            <b id="eventStat">
                0
            </b>
            <span>
                События
            </span>
        </div>



        <div>
            <b id="favoriteStat">
                0
            </b>
            <span>
                Избранное
            </span>
        </div>


    </div>





    <button class="profile-button">

        ✏️ Изменить профиль

    </button>




    <button class="profile-button">

        ⚙️ Настройки

    </button>




    <button class="profile-button login">

        🔐 Войти / Регистрация

    </button>




</div>





<nav class="bottom-nav">


<button class="nav-item"
onclick="goHome()">

🏠

<small>
Главная
</small>

</button>



<button class="nav-item"
onclick="goCalendar()">

📅

<small>
Календарь
</small>

</button>



<button class="nav-item"
onclick="goEvents()">

✨

<small>
События
</small>

</button>



<button class="nav-item active"
onclick="goProfile()">

👤

<small>
Профиль
</small>

</button>



</nav>




<script src="profile.js"></script>


</body>

</html>
