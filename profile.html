<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Memora — Profile</title>

<link
    rel="stylesheet"
    href="profile.css"
>

</head>


<body class="profile-page">


<div class="profile-background">

    <div class="glow glow-one"></div>

    <div class="glow glow-two"></div>

    <div class="stars"></div>

</div>



<main class="profile-container">


    <!-- =====================================
            TOP BAR
    ====================================== -->

    <header class="profile-header">


        <button
            id="backButton"
            class="back-button"
            type="button"
            aria-label="Back"
        >

            <span>←</span>

        </button>



        <div class="profile-header-title">

            <span>PROFILE</span>

            <small>YOUR MEMORY SPACE</small>

        </div>


    </header>



    <!-- =====================================
            PROFILE HERO
    ====================================== -->

    <section class="profile-hero">


        <div class="profile-orbit">


            <div class="profile-orbit-ring ring-one"></div>

            <div class="profile-orbit-ring ring-two"></div>

            <div class="profile-orbit-ring ring-three"></div>


            <div class="profile-avatar">

                M

            </div>


        </div>



        <h1 id="profileEmail">

            Loading...

        </h1>


        <p>

            Memora member

        </p>



        <div
            id="accountStatus"
            class="account-status"
        >

            <span class="status-dot"></span>

            Account connected

        </div>


    </section>



    <!-- =====================================
            STATISTICS
    ====================================== -->

    <section class="profile-stats">


        <div class="stat-card">


            <span
                id="memoryTotal"
                class="stat-number"
            >
                0
            </span>


            <span class="stat-label">
                Memories
            </span>


        </div>



        <div class="stat-card">


            <span
                id="accountDate"
                class="stat-number small-number"
            >
                —
            </span>


            <span class="stat-label">
                Joined
            </span>


        </div>



    </section>



    <!-- =====================================
            ACCOUNT INFO
    ====================================== -->

    <section class="settings-card">


        <div class="card-heading">


            <div>

                <span class="card-kicker">
                    ACCOUNT
                </span>


                <h2>
                    Account information
                </h2>

            </div>


            <span class="card-icon">
                ◈
            </span>


        </div>



        <div class="info-row">


            <div class="info-left">

                <span class="info-label">
                    Email
                </span>

                <span
                    id="emailValue"
                    class="info-value"
                >
                    Loading...
                </span>

            </div>


            <span class="verified-badge">
                VERIFIED
            </span>


        </div>



        <div class="info-row">


            <div class="info-left">

                <span class="info-label">
                    Authentication
                </span>

                <span class="info-value">
                    Supabase
                </span>

            </div>


            <span class="secure-badge">
                SECURE
            </span>


        </div>


    </section>



    <!-- =====================================
            ACTIONS
    ====================================== -->

    <section class="actions-card">


        <button
            id="logoutButton"
            class="logout-button"
            type="button"
        >

            <span class="logout-icon">
                ↪
            </span>


            <span class="logout-text">

                <strong>
                    Log out
                </strong>

                <small>
                    Sign out of this device
                </small>

            </span>


            <span class="logout-arrow">
                →
            </span>

        </button>


    </section>



</main>



<!-- =====================================
            BOTTOM NAV
====================================== -->

<nav class="bottom-nav">


    <button
        class="nav-item"
        id="homeNav"
        type="button"
    >

        <span class="nav-icon">
            ◉
        </span>

        <small>
            Memories
        </small>

    </button>



    <button
        class="nav-item"
        id="calendarNav"
        type="button"
    >

        <span class="nav-icon">
            ◫
        </span>

        <small>
            Calendar
        </small>

    </button>



    <button
        class="nav-item"
        id="eventsNav"
        type="button"
    >

        <span class="nav-icon">
            ◇
        </span>

        <small>
            Events
        </small>

    </button>



    <button
        class="nav-item active"
        id="profileNav"
        type="button"
    >

        <span class="nav-icon">
            ●
        </span>

        <small>
            Profile
        </small>

    </button>


</nav>



<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script src="profile.js"></script>


</body>

</html>
