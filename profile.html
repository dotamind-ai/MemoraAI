<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memora Profile</title>


<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="profile.css">


</head>



<body class="profile-page">



<div class="profile-container">



    <!-- ПРОФИЛЬ -->

    <div class="profile-card">



        <!-- КРУГЛАЯ КНОПКА MEMORA -->

        <div 
        class="memora-profile-logo"
        id="profileMenuButton">



            <div class="logo-orbit orbit-a">

                <span></span>

            </div>



            <div class="logo-orbit orbit-b">

                <span></span>

            </div>



            <div class="logo-orbit orbit-c">

                <span></span>

            </div>



            <div class="logo-letter">

                M

            </div>



        </div>







        <!-- ИМЯ -->

        <h1 
        class="profile-name"
        id="profileName">

            Гость

        </h1>





        <p class="profile-status">

            ✨ Memory Keeper

        </p>



    </div>








    <!-- СТАТИСТИКА -->


    <div class="profile-stats">



        <div class="stat-card">


            <span id="memoryStat">

                0

            </span>


            <small>

                Memories

            </small>


        </div>





        <div class="stat-card">


            <span id="eventStat">

                0

            </span>


            <small>

                Events

            </small>


        </div>





        <div class="stat-card">


            <span id="favoriteStat">

                0

            </span>


            <small>

                Favorites

            </small>


        </div>



    </div>










</div>








<!-- ЗАТЕМНЕНИЕ -->

<div 
class="profile-overlay"
id="profileOverlay">

</div>








<!-- ВСПЛЫВАЮЩЕЕ МЕНЮ -->


<div 
class="profile-menu"
id="profileMenu">



    <button 
    id="editProfile">

        ✏️ Edit Profile

    </button>





    <button 
    onclick="goSettings()">

        ⚙ Settings

    </button>





    <button 
    id="loginButton">

        🔐 Login / Register

    </button>





    <button>

        🏆 Achievements

    </button>




</div>









<!-- НИЖНЯЯ НАВИГАЦИЯ -->


<nav class="bottom-nav">



<button 
class="nav-item"
onclick="goHome()">



🏠

<small>

Home

</small>


</button>







<button 
class="nav-item"
onclick="goCalendar()">



📅

<small>

Calendar

</small>


</button>







<button 
class="nav-item"
onclick="goEvents()">



✨

<small>

Events

</small>


</button>







<button 
class="nav-item active"
onclick="goProfile()">



👤

<small>

Profile

</small>


</button>





</nav>










<script src="profile.js"></script>



</body>

</html>
