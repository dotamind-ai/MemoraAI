<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Memora Profile</title>


<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="profile.css">


</head>



<body class="profile-page">





<div class="profile-container">





    <!-- PROFILE CARD -->


    <div class="profile-card">



        <!-- Avatar -->


        <div 
        class="profile-avatar" 
        id="profileAvatar">


            👤


        </div>







        <!-- Name -->


        <h1 
        class="profile-name"
        id="profileName">


            Гость


        </h1>







        <!-- Status -->


        <p class="profile-status">


            ✨ Хранитель воспоминаний


        </p>




    </div>









    <!-- STATISTICS -->



    <div class="profile-stats">





        <div class="stat-card">


            <span id="memoryStat">

                0

            </span>


            <small>

                Память

            </small>


        </div>







        <div class="stat-card">


            <span id="eventStat">

                0

            </span>


            <small>

                События

            </small>


        </div>







        <div class="stat-card">


            <span id="favoriteStat">

                0

            </span>


            <small>

                Избранное

            </small>


        </div>





    </div>









    <!-- ACHIEVEMENTS -->


    <div class="achievements-box">



        <h2>


            🏆 Achievements


        </h2>






        <div class="achievements-list">





            <div class="achievement unlocked">



                <span class="achievement-icon">


                    🧠


                </span>




                <div>


                    <h3>

                        Memory Keeper

                    </h3>


                    <p>

                        Created your first memory

                    </p>



                </div>



            </div>









            <div class="achievement locked">



                <span class="achievement-icon">


                    🔒


                </span>




                <div>


                    <h3>

                        Story Collector

                    </h3>


                    <p>

                        Create 10 memories

                    </p>



                </div>



            </div>









            <div class="achievement locked">



                <span class="achievement-icon">


                    🔒


                </span>




                <div>


                    <h3>

                        Memory Master

                    </h3>


                    <p>

                        Create 50 memories

                    </p>



                </div>



            </div>









            <div class="achievement locked">



                <span class="achievement-icon">


                    🔒


                </span>




                <div>


                    <h3>

                        Archive Master

                    </h3>


                    <p>

                        Build your archive

                    </p>



                </div>



            </div>






        </div>



    </div>









    <!-- ACTION BUTTONS -->



    <div class="profile-actions">





        <button 
        class="profile-button"
        id="editProfile">



            ✏️ Изменить профиль



        </button>








        <button 
        class="profile-button"
        onclick="goSettings()">



            ⚙️ Настройки



        </button>








        <button 
        class="profile-button login-button"
        id="loginButton">



            🔐 Войти / Регистрация



        </button>






    </div>








</div>









<!-- BOTTOM NAVIGATION -->



<nav class="bottom-nav">





    <button 
    class="nav-item"
    onclick="goHome()">



        🏠


        <small>

            Главная

        </small>



    </button>









    <button 
    class="nav-item"
    onclick="goCalendar()">



        📅


        <small>

            Календарь

        </small>



    </button>









    <button 
    class="nav-item"
    onclick="goEvents()">



        ✨


        <small>

            События

        </small>



    </button>









    <button 
    class="nav-item active"
    onclick="goProfile()">



        👤


        <small>

            Профиль

        </small>



    </button>





</nav>








<script src="profile.js"></script>



</body>


</html>
