<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEMORA</title>


<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<header>


<div class="logo">

<div class="core">

<div class="ring"></div>

<div class="point"></div>

</div>

</div>



<h1>MEMORA</h1>


<p>
Твоя цифровая память
</p>


</header>





<section class="glass">


<button id="addMemory">

+ Новая память

</button>





<div id="memoryBox" class="hidden">





<div class="memory-types">


<button class="type-button active" data-type="idea">

◇ Идея

</button>


<button class="type-button" data-type="goal">

◎ Цель

</button>


<button class="type-button" data-type="note">

▤ Заметка

</button>


<button class="type-button" data-type="project">

◈ Проект

</button>


<button class="type-button" data-type="personal">

◉ Личное

</button>


</div>







<input 
id="memoryTitle"
placeholder="Название памяти">






<textarea
id="memoryText"
placeholder="Запиши мысль">
</textarea>







<button id="saveMemory">

Сохранить

</button>



</div>


</section>







<section>


<h3 id="memoryCount">

0 воспоминаний

</h3>



<div id="memoryList"></div>


</section>





</div>






<script src="app.js?v=2"></script>



</body>

</html>
