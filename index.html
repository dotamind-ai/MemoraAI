<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Memora AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>


<div class="container">

    <div class="logo">
        🧠
    </div>

    <h1>
        Memora AI
    </h1>

    <p>
        Твой второй мозг
    </p>


    <button id="addMemory">
        ＋ Добавить память
    </button>


    <div id="memoryBox" class="hidden">

        <input 
        id="memoryTitle"
        placeholder="Название памяти">


        <textarea
        id="memoryText"
        placeholder="Что сохранить?">
        </textarea>


        <button id="saveMemory">
            Сохранить
        </button>

    </div>


    <div id="memoryList"></div>


</div>


<script src="app.js"></script>


</body>

</html>
