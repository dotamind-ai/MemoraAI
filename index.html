<!DOCTYPE html>

<head>

<title>MEMORA</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="logo">

<div class="core">

<div class="ring"></div>

<div class="point"></div>

</div>

<h1>MEMORA</h1>

</header>


<section class="hero">

id="memoryTitle"
placeholder="Название">

id="memoryText"
placeholder="Запиши мысль..."></textarea>

<section>

<h3>

</div>
