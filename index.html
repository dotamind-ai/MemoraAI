<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memora</title>

<link rel="stylesheet" href="style.css">

</head>


<body class="home-page">



<div class="home-container">



<!-- =========================
        HEADER
========================= -->


<header class="home-header">



<div class="memora-mark">


    <div class="logo-orbit orbit-one">

        <span></span>

    </div>



    <div class="logo-orbit orbit-two">

        <span></span>

    </div>




    <div class="logo-core">

        M

    </div>



</div>






<div class="brand-text">


<h1>

Memora

</h1>



<p>

Your memory space

</p>



</div>



</header>









<!-- =========================
        QUICK THOUGHT
========================= -->


<section class="quick-memory">



<h2>

Quick Thought

</h2>




<p>

Capture your idea

</p>






<textarea

id="memoryInput"

placeholder="Write something...">

</textarea>






<button id="saveMemory">

Save

</button>




</section>









<!-- =========================
        MEMORY FEED
========================= -->


<section class="feed">



<h2>

Memory Feed

</h2>






<div id="memoryList">


</div>





</section>






</div>









<!-- =========================
        NAVIGATION
========================= -->


<nav class="bottom-nav">





<button

class="nav-item active"

onclick="goHome()">



<img 

src="icons/memories.svg"

class="nav-icon">



<small>

Memories

</small>



</button>









<button

class="nav-item"

onclick="goCalendar()">



<img 

src="icons/calendar.svg"

class="nav-icon">



<small>

Calendar

</small>



</button>









<button

class="nav-item"

onclick="goEvents()">



<img 

src="icons/events.svg"

class="nav-icon">



<small>

Events

</small>



</button>









<button

class="nav-item"

onclick="goProfile()">



<img 

src="icons/profile.svg"

class="nav-icon">



<small>

Profile

</small>



</button>






</nav>









<script src="app.js"></script>



</body>

</html>
