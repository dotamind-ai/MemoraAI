<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Memora</title>

<link rel="stylesheet" href="style.css">


<script>

    // Проверяем авторизацию

    if (localStorage.getItem("memoraAuth") !== "true") {

        window.location.href =
            "welcome/welcome.html";

    }

</script>

</head>


<body class="home-page">


<div class="home-container">


<!-- =====================================
        HEADER
===================================== -->

<header class="home-header">


    <div class="memora-logo">


        <div class="orbit orbit-one">

            <span class="planet planet-one"></span>

        </div>


        <div class="orbit orbit-two">

            <span class="planet planet-two"></span>

        </div>


        <div class="orbit orbit-three">

            <span class="planet planet-three"></span>

        </div>


        <div class="logo-m">

            M

        </div>


    </div>



    <div class="header-text">

        <h1>
            Memora
        </h1>

        <p>
            Your memory space
        </p>

    </div>


</header>



<!-- =====================================
        CREATE MEMORY
===================================== -->

<section class="capture-card">


    <h2>
        Capture
    </h2>


    <p>
        Store what matters
    </p>


    <textarea
        id="memoryInput"
        placeholder="Write your thought..."
    ></textarea>


    <div class="memory-types">


        <button
            class="type-btn active"
            data-type="idea"
            type="button"
        >
            IDEA
        </button>


        <button
            class="type-btn"
            data-type="note"
            type="button"
        >
            NOTE
        </button>


        <button
            class="type-btn"
            data-type="inspiration"
            type="button"
        >
            INSPIRATION
        </button>


        <button
            class="type-btn"
            data-type="goal"
            type="button"
        >
            GOAL
        </button>


    </div>


    <button
        id="saveMemory"
        class="save-button"
        type="button"
    >
        Save Memory
    </button>


</section>



<!-- =====================================
        MEMORY FEED
===================================== -->

<section class="memory-feed">


    <div class="feed-header">


        <h2>
            Recent Memories
        </h2>


        <span id="memoryCount">
            0
        </span>


    </div>


    <div id="memoryList"></div>


</section>


</div>



<!-- =====================================
        BOTTOM NAVIGATION
===================================== -->

<nav class="bottom-nav">


    <button
        class="nav-item active"
        onclick="goHome()"
        type="button"
    >

        <img src="icons/memories.svg">

        <small>
            Memories
        </small>

    </button>



    <button
        class="nav-item"
        onclick="goCalendar()"
        type="button"
    >

        <img src="icons/calendar.svg">

        <small>
            Calendar
        </small>

    </button>



    <button
        class="nav-item"
        onclick="goEvents()"
        type="button"
    >

        <img src="icons/events.svg">

        <small>
            Events
        </small>

    </button>



    <button
        class="nav-item"
        onclick="goProfile()"
        type="button"
    >

        <img src="icons/profile.svg">

        <small>
            Profile
        </small>

    </button>


</nav>



<script src="app.js"></script>


</body>

</html>
