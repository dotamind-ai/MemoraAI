<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEMORA</title>


<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">



<header>


<div class="logo">


<div class="core">


<div class="ring"></div>


<div class="memory-letter">
M
</div>


<div class="particle p1"></div>

<div class="particle p2"></div>

<div class="particle p3"></div>


</div>


</div>




<h1>
MEMORA
</h1>


<p>
Твоя цифровая память
</p>



</header>








<section class="glass">



<button id="addMemory">

+ Новая память

</button>







<div id="memoryBox" class="hidden">






<div class="memory-types">



<button 
class="type-button active"
data-type="idea">

◇ Идея

</button>




<button 
class="type-button"
data-type="goal">

◎ Цель

</button>




<button 
class="type-button"
data-type="note">

▤ Заметка

</button>




<button 
class="type-button"
data-type="project">

◈ Проект

</button>




<button 
class="type-button"
data-type="personal">

◉ Личное

</button>



</div>








<input

id="memoryTitle"

type="text"

placeholder="Название памяти"

>







<textarea

id="memoryText"

placeholder="Запиши мысль..."

></textarea>








<input

id="memoryType"

type="hidden"

value="idea"

>







<button id="saveMemory">

Сохранить

</button>





<button id="cancelEdit" class="hidden">

Отмена

</button>





</div>



</section>









<section class="memories">







<input

id="searchMemory"

type="text"

placeholder="🔎 Поиск памяти..."

>







<button id="openFilters">

⚙️ Фильтры

</button>








<div id="filterPanel" class="hidden filter-panel">



<h3>

Настройки памяти

</h3>








<div class="filters">



<button

class="filter-button active"

data-filter="all">

Все

</button>




<button

class="filter-button"

data-filter="idea">

◇ Идеи

</button>




<button

class="filter-button"

data-filter="goal">

◎ Цели

</button>




<button

class="filter-button"

data-filter="note">

▤ Заметки

</button>




<button

class="filter-button"

data-filter="project">

◈ Проекты

</button>




<button

class="filter-button"

data-filter="personal">

◉ Личное

</button>



</div>








<select id="sortMemory">


<option value="new">

Новые

</option>


<option value="old">

Старые

</option>


<option value="favorite">

Закреплённые

</option>



</select>






</div>








<h3 id="memoryCount">

0 воспоминаний

</h3>








<div id="memoryList">

</div>







</section>







</div>







<script src="app.js"></script>


</body>

</html>
