<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Memora</title>


<link rel="stylesheet" href="style.css">


</head>


<body class="home-page">



<div class="home-container">



<!-- HEADER -->

<header class="home-header">



<div class="memora-logo">



    <!-- Орбиты с планетами -->

    <div class="logo-circle circle-one">

        <span class="planet planet-one"></span>

    </div>



    <div class="logo-circle circle-two">

        <span class="planet planet-two"></span>

    </div>



    <div class="logo-circle circle-three">

        <span class="planet planet-three"></span>

    </div>




    <!-- Центральная M -->

    <div class="logo-m">

        M

    </div>



</div>






<div class="header-text">


<h1>

Memora

</h1>


<p>

Your memory space

</p>


</div>



</header>









<!-- СОЗДАНИЕ МЫСЛИ -->


<section class="capture-card">


<h2>

Capture

</h2>


<p>

Store what matters

</p>





<textarea

id="memoryInput"

placeholder="Write your thought..."

></textarea>





<div class="memory-types">



<button 
class="type-btn active"
data-type="idea">

IDEA

</button>





<button 
class="type-btn"
data-type="note">

NOTE

</button>





<button 
class="type-btn"
data-type="inspiration">

INSPIRATION

</button>





<button 
class="type-btn"
data-type="goal">

GOAL

</button>



</div>






<button

id="saveMemory"

class="save-button"

>

Save Memory

</button>



</section>









<!-- ЛЕНТА ПАМЯТИ -->


<section class="memory-feed">



<div class="feed-header">



<h2>

Recent Memories

</h2>




<span id="memoryCount">

0

</span>



</div>






<div id="memoryList">


</div>



</section>







</div>









<!-- НИЖНЯЯ НАВИГАЦИЯ -->


<nav class="bottom-nav">



<button 
class="nav-item active"
onclick="goHome()">



<img src="icons/memories.svg">


<small>

Memories

</small>


</button>







<button 
class="nav-item"
onclick="goCalendar()">



<img src="icons/calendar.svg">


<small>

Calendar

</small>


</button>







<button 
class="nav-item"
onclick="goEvents()">



<img src="icons/events.svg">


<small>

Events

</small>


</button>







<button 
class="nav-item"
onclick="goProfile()">



<img src="icons/profile.svg">


<small>

Profile

</small>


</button>





</nav>









<script src="app.js"></script>


</body>

</html>
