<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MEMORA</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">



<header>


<div class="logo">

    <div class="core">

        <div class="ring"></div>

        <div class="point"></div>

    </div>

</div>



<h1>
MEMORA
</h1>


<p>
Remember less. Think more.
</p>



</header>




<div class="glass">


<h2>
✨ Сегодня
</h2>


<span id="memoryCount">
0 воспоминаний
</span>


</div>





<button id="addMemory">

＋ Новая память

</button>





<div id="memoryBox" class="hidden">


<input
id="memoryTitle"
type="text"
placeholder="Название памяти">



<textarea
id="memoryText"
placeholder="Запиши мысль">
</textarea>



<button id="saveMemory">

Сохранить

</button>


</div>





<h3>
Последние записи
</h3>



<div id="memoryList">

</div>



</div>



<script src="app.js"></script>


</body>

</html>
